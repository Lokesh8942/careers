name: Career Opportunity Agent

on:
  # ── Daily scan at 9:00 AM IST (3:30 AM UTC) ──────────────────────────────
  schedule:
    - cron: "30 3 * * *"

  # ── Manual trigger from GitHub Actions tab ───────────────────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: "Manual rescan"

jobs:
  scan:
    name: Scan & Deliver Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Restore seen.json and tracker.db from cache
      #    So duplicate filter and apply tracker persist across runs
      - name: Restore persistent data
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            tracker.db
            history/
          key: agent-data-${{ runner.os }}
          restore-keys: |
            agent-data-

      # 5. Run the agent
      - name: Run career agent
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID:       ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:      ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY:     ${{ secrets.JSEARCH_API_KEY }}
        run: python agent.py

      # 6. Save seen.json, tracker.db, history/ back to cache
      - name: Save persistent data
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            seen.json
            tracker.db
            history/
          key: agent-data-${{ runner.os }}-${{ github.run_id }}

      # 7. Upload logs as artifact (viewable in Actions tab)
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-log-${{ github.run_id }}
          path: agent.log
          retention-days: 7
